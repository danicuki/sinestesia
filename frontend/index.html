<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinestesia</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Start gate — browsers require a user gesture to unlock AudioContext. */
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 10;
        cursor: pointer;
        transition: opacity 0.6s ease;
      }
      #gate.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #gate button {
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 18px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #eee;
        background: transparent;
        border: 1px solid #444;
        border-radius: 2px;
        padding: 18px 42px;
        cursor: pointer;
        transition: border-color 0.3s, color 0.3s;
      }
      #gate button:hover {
        border-color: #aaa;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="gate">
      <button id="start">Sinestesia</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
